<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ dash_title or "OLX UZ — KPI Dashboard" }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="back" href="/" title="All dashboards">←</a>
  <span class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
      <defs><linearGradient id="dxg" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#4c6ef5"/><stop offset="1" stop-color="#9775fa"/>
      </linearGradient></defs>
      <rect x="1" y="1" width="22" height="22" rx="6.5" fill="url(#dxg)"/>
      <rect x="5.5" y="12.5" width="3.2" height="6.5" rx="1.2" fill="#fff" opacity=".92"/>
      <rect x="10.4" y="8.5" width="3.2" height="10.5" rx="1.2" fill="#fff" opacity=".92"/>
      <rect x="15.3" y="5" width="3.2" height="14" rx="1.2" fill="#fff" opacity=".92"/>
    </svg>
    <span class="wordmark">Dash<span class="x">xona</span></span>
  </span>
  <span class="dash-title">{{ dash_title or "OLX UZ KPI dashboard" }}</span>
  <nav class="tabs">
    {% for tab_id, path, label in tabs %}
    <a href="{{ path }}{% if filter_qs is defined and filter_qs and tab_id != 'dictionary' %}{{ filter_qs }}{% endif %}"
       class="tab {{ 'active' if tab_id == active }}">{{ label }}</a>
    {% endfor %}
  </nav>
  <div class="topbar-right">
    {% if freshness %}
    <span class="fresh fresh-{{ freshness }}" title="Snapshot built {{ built_at }} UTC">
      {% if age_hours is not none %}data {{ age_hours }}h old{% else %}no data{% endif %}
    </span>
    {% endif %}
    <a class="logout" href="{{ url_for('logout') }}">Log out</a>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
